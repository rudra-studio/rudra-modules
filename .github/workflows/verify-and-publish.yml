name: Verify, Build, and Publish Module

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  verify-and-merge:
    # Only run this pipeline if the PR was generated by our Go bot
    if: startsWith(github.head_ref, 'feature/publish-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse Metadata from PR Body
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_BODY=$(gh pr view ${{ github.event.pull_request.number }} --json body -q .body)
          
          # Extract variables using grep
          echo "job_id=$(echo "$PR_BODY" | grep -oP 'JobID: \K.*')" >> $GITHUB_OUTPUT
          echo "module=$(echo "$PR_BODY" | grep -oP 'Module: \K.*')" >> $GITHUB_OUTPUT
          echo "version=$(echo "$PR_BODY" | grep -oP 'Version: \K.*')" >> $GITHUB_OUTPUT
          echo "version_id=$(echo "$PR_BODY" | grep -oP 'VersionID: \K.*')" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build (Vite)
        env:
          MODULE: ${{ steps.meta.outputs.module }}
        run: |
          cd $MODULE
          npm install
          npx vite build
          cp src/module.server.js dist/module.server.js

      - name: Commit 'dist' folder back to PR
        env:
          MODULE: ${{ steps.meta.outputs.module }}
        run: |
          git config user.name "Rudra CI Bot"
          git config user.email "ci-bot@rudra.dev"
          
          git add $MODULE/dist/
          
          # Check if there are actual changes in dist/
          if ! git diff --staged --quiet; then
            # [skip ci] prevents GitHub Actions from triggering another run from this commit!
            git commit -m "chore: inject compiled dist artifacts [skip ci]"
            git push origin ${{ github.head_ref }}
          fi

      - name: Approve and Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Approve the PR
          gh pr review ${{ github.event.pull_request.number }} --approve
          sleep 5
          # Squash and Merge the PR into Main
          gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch

      - name: Tag the Release on Main
        env:
          MODULE: ${{ steps.meta.outputs.module }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # Fetch the newly merged main branch
          git fetch origin main
          git checkout main
          git pull origin main
          
          SAFE_VERSION=$(echo $VERSION | tr '.' '-')
          TAG_NAME="$MODULE-v$SAFE_VERSION"
          
          git tag $TAG_NAME
          git push origin $TAG_NAME

      - name: Invoke Go Webhook
        env:
          WEBHOOK_URL: ${{ secrets.RUDRA_WEBHOOK_URL }} # Add this in Repo Settings -> Secrets
        run: |
          curl -X POST $WEBHOOK_URL \
          -H "Content-Type: application/json" \
          -d '{
            "jobId": "${{ steps.meta.outputs.job_id }}",
            "versionId": "${{ steps.meta.outputs.version_id }}",
            "module": "${{ steps.meta.outputs.module }}",
            "version": "${{ steps.meta.outputs.version }}",
            "status": "success"
          }'
