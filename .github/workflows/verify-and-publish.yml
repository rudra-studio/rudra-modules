name: Verify, Build, and Publish Module

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  verify-and-merge:
    # Only run this pipeline if the PR was generated by our Go bot
    if: startsWith(github.head_ref, 'feature/publish-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse Metadata from PR Body
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_BODY=$(gh pr view ${{ github.event.pull_request.number }} --json body -q .body)
          
          # Extract variables using grep
          echo "job_id=$(echo "$PR_BODY" | grep -oP 'JobID: \K.*')" >> $GITHUB_OUTPUT
          echo "module=$(echo "$PR_BODY" | grep -oP 'Module: \K.*')" >> $GITHUB_OUTPUT
          echo "version=$(echo "$PR_BODY" | grep -oP 'Version: \K.*')" >> $GITHUB_OUTPUT
          echo "version_id=$(echo "$PR_BODY" | grep -oP 'VersionID: \K.*')" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build (Vite)
        id: build
        env:
          MODULE: ${{ steps.meta.outputs.module }}
        run: |
          cd $MODULE
          npm install
          npx vite build
          cp src/module.server.js dist/module.server.js

      - name: Commit 'dist' folder back to PR
        id: commit_dist
        env:
          MODULE: ${{ steps.meta.outputs.module }}
        run: |
          git config user.name "Rudra CI Bot"
          git config user.email "ci-bot@rudra.dev"
          
          git add $MODULE/dist/
          
          # Check if there are actual changes in dist/
          if ! git diff --staged --quiet; then
            # [skip ci] prevents GitHub Actions from triggering another run from this commit!
            git commit -m "chore: inject compiled dist artifacts [skip ci]"
            git push origin ${{ github.head_ref }}
          fi

      - name: Approve and Merge PR
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Fetch main so the GitHub CLI doesn't crash during local cleanup
          git fetch origin main
          # Approve the PR
          gh pr review ${{ github.event.pull_request.number }} --approve
          sleep 5
          # Squash and Merge the PR into Main
          gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch

      - name: Tag the Release on Main
        id: tag
        env:
          MODULE: ${{ steps.meta.outputs.module }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # Fetch the newly merged main branch
          git fetch origin main
          git checkout main
          git pull origin main
          
          SAFE_VERSION=$(echo $VERSION | tr '.' '-')
          TAG_NAME="$MODULE-v$SAFE_VERSION"
          
          git tag $TAG_NAME
          git push origin $TAG_NAME

      - name: Notify Rudra Backend
        if: ${{ always() }}
        env:
          WEBHOOK_URL: ${{ vars.RUDRA_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          JOB_ID: ${{ steps.meta.outputs.job_id }}
          VERSION_ID: ${{ steps.meta.outputs.version_id }}
          MODULE: ${{ steps.meta.outputs.module }}
          VERSION: ${{ steps.meta.outputs.version }}
          PIPELINE_STATUS: ${{ job.status }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit_dist.outcome }}
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
          TAG_OUTCOME: ${{ steps.tag.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          STATUS="success"
          ERROR_MESSAGE=""

          if [ "$PIPELINE_STATUS" != "success" ]; then
            STATUS="failed"
            ERROR_MESSAGE="GitHub Actions module publish pipeline failed (build=$BUILD_OUTCOME, commit=$COMMIT_OUTCOME, merge=$MERGE_OUTCOME, tag=$TAG_OUTCOME). Run: $RUN_URL"
          fi

          PAYLOAD=$(jq -n \
            --arg jobId "$JOB_ID" \
            --arg versionId "$VERSION_ID" \
            --arg module "$MODULE" \
            --arg version "$VERSION" \
            --arg status "$STATUS" \
            --arg error "$ERROR_MESSAGE" \
            '{jobId: $jobId, versionId: $versionId, module: $module, version: $version, status: $status} + (if $error == "" then {} else {error: $error} end)')

          curl --fail-with-body --retry 3 --retry-all-errors --location "$WEBHOOK_URL" \
            --header "x-auth-code: $WEBHOOK_SECRET" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD"
